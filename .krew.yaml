apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kq
spec:
  version: v0.1.0
  homepage: https://github.com/yourorg/kq
  shortDescription: Relationship-aware Kubernetes viewer
  description: |
    kq shows a Kubernetes resource plus everything it references or owns:
    owners, ConfigMaps, Secrets, PVCs, ServiceAccounts, Services, Ingresses,
    HPAs, PDBs, and recent Events, in one read-only command.
  platforms:
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/yourorg/kq/releases/download/v0.1.0/kubectl-kq_linux_amd64.tar.gz
      sha256: REPLACE_WITH_RELEASE_SHA256
      bin: kubectl-kq
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/yourorg/kq/releases/download/v0.1.0/kubectl-kq_darwin_amd64.tar.gz
      sha256: REPLACE_WITH_RELEASE_SHA256
      bin: kubectl-kq
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/yourorg/kq/releases/download/v0.1.0/kubectl-kq_darwin_arm64.tar.gz
      sha256: REPLACE_WITH_RELEASE_SHA256
      bin: kubectl-kq
